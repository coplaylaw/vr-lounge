<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CO:PLAY Lounge</title>
  <style>
    /* CO:PLAYs CVI-farver, se src/palette.js */
    :root {
      --navy: #15253E;
      --cyan: #71CDDC;
      --text: #ffffff;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--navy);
      color: var(--text);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    }
    canvas { display: block; touch-action: none; }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 16px;
      text-align: center;
      background: radial-gradient(ellipse at center, #1f3557, var(--navy));
    }
    #overlay.hidden { display: none; }
    #overlay h1 { margin: 0; }
    #overlay h1 img {
      display: block;
      width: min(80vw, 560px);
      height: auto;
      filter: drop-shadow(0 0 18px rgba(113, 205, 220, 0.55));
    }
    #overlay p { margin: 0; font-size: clamp(18px, 3vw, 28px); max-width: 640px; }
    #start {
      margin-top: 12px;
      padding: 22px 56px;
      font-size: clamp(22px, 3.5vw, 34px);
      font-weight: 600;
      color: var(--navy);
      background: var(--cyan);
      border: 0;
      border-radius: 999px;
      box-shadow: 0 0 24px rgba(113, 205, 220, 0.6);
      cursor: pointer;
    }
    #start:active { transform: scale(0.97); }
    #flat {
      padding: 12px 28px;
      font-size: 18px;
      color: var(--text);
      background: none;
      border: 1px solid var(--cyan);
      border-radius: 999px;
      cursor: pointer;
    }
    #flat[hidden] { display: none; }
    #hint { font-size: 16px; opacity: 0.7; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <h1><img src="assets/coplay-logo.png" alt="CO:PLAY" width="942" height="160"></h1>
    <p>Velkommen til vores virtuelle venteværelse<br>Welcome to our virtual waiting room</p>
    <button id="start">Start</button>
    <button id="flat" hidden></button>
    <p id="hint"></p>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
