<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CO:PLAY Lounge</title>
  <style>
    :root {
      --navy: #050b18;
      --cyan: #36d6ff;
      --amber: #ffb45e;
      --text: #e6f4ff;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--navy);
      color: var(--text);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    }
    canvas { display: block; }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 16px;
      text-align: center;
      background: radial-gradient(ellipse at center, rgba(10, 30, 60, 0.85), rgba(5, 11, 24, 0.97));
    }
    #overlay.hidden { display: none; }
    #overlay h1 {
      margin: 0;
      font-size: clamp(48px, 10vw, 110px);
      letter-spacing: 0.04em;
      color: var(--cyan);
      text-shadow: 0 0 12px var(--cyan), 0 0 36px rgba(54, 214, 255, 0.6);
    }
    #overlay p { margin: 0; font-size: clamp(18px, 3vw, 28px); max-width: 640px; }
    #start {
      margin-top: 12px;
      padding: 22px 56px;
      font-size: clamp(22px, 3.5vw, 34px);
      font-weight: 600;
      color: var(--navy);
      background: var(--cyan);
      border: 0;
      border-radius: 999px;
      box-shadow: 0 0 24px rgba(54, 214, 255, 0.7);
      cursor: pointer;
    }
    #start:active { transform: scale(0.97); }
    #hint { font-size: 16px; opacity: 0.7; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <h1>CO:PLAY</h1>
    <p>Velkommen til vores virtuelle venteværelse</p>
    <button id="start">Start oplevelsen</button>
    <p id="hint"></p>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
